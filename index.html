<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moood TV Digital Signage</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;overflow:hidden}
#player{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
#status{position:absolute;left:14px;bottom:12px;padding:8px 10px;background:rgba(0,0,0,.55);color:#fff;font:16px Arial,sans-serif;border-radius:4px;display:none;z-index:20}
</style>
</head>
<body>
<div id="stage">
  <video id="player" autoplay loop playsinline webkit-playsinline preload="auto"></video>
  <div id="status"></div>
</div>
<script>
(function(){
  var player=document.getElementById('player');
  var status=document.getElementById('status');
  var currentSrc='';
  var currentCfg=null;
  var pollTimer=null;
  var watchdogTimer=null;
  var lastTime=-1;
  var stuckCount=0;

  function showStatus(msg,always){
    status.innerHTML=msg;
    status.style.display=always?'block':'none';
  }

  function applyFit(fit){
    fit=(fit||'contain').toLowerCase();
    if(player.style.objectFit!==undefined){
      player.style.objectFit=(fit==='cover')?'cover':'contain';
    }else{
      player.style.width='100%';
      player.style.height='100%';
    }
  }

  function safePlay(){
    try{
      var p=player.play();
      if(p && typeof p.catch==='function'){
        p.catch(function(){});
      }
    }catch(e){}
  }

  function loadVideo(src){
    if(!src){showStatus('No video configured',true);return;}
    if(src===currentSrc){safePlay();return;}
    currentSrc=src;
    try{
      player.pause();
      player.removeAttribute('src');
      player.load();
    }catch(e){}
    player.src=src;
    player.load();
    safePlay();
  }

  function applyConfig(cfg){
    currentCfg=cfg||{};
    player.loop = cfg.loop!==false;
    player.muted = cfg.muted!==false;
    player.volume = (typeof cfg.volume==='number') ? Math.max(0,Math.min(1,cfg.volume)) : 1;
    applyFit(cfg.fit||'contain');
    loadVideo(cfg.video||'');
    showStatus('',false);
  }

  function fetchConfig(){
    var xhr=new XMLHttpRequest();
    xhr.open('GET','config.json?t='+(new Date().getTime()),true);
    xhr.onreadystatechange=function(){
      if(xhr.readyState===4){
        if(xhr.status>=200 && xhr.status<300){
          try{ applyConfig(JSON.parse(xhr.responseText)); }
          catch(e){ showStatus('Config error',true); }
        }
      }
    };
    try{xhr.send(null);}catch(e){}
  }

  player.onerror=function(){
    showStatus('Retrying video...',false);
    setTimeout(function(){ if(currentSrc){ player.src=currentSrc+'?r='+(new Date().getTime()); player.load(); safePlay(); } },4000);
  };

  player.onended=function(){
    try{player.currentTime=0;}catch(e){}
    safePlay();
  };

  player.oncanplay=function(){ safePlay(); };

  watchdogTimer=setInterval(function(){
    try{
      var t=player.currentTime||0;
      if(!player.paused && t===lastTime){ stuckCount++; } else { stuckCount=0; }
      lastTime=t;
      if(player.paused){ safePlay(); }
      if(stuckCount>=3 && currentSrc){
        stuckCount=0;
        player.load();
        safePlay();
      }
    }catch(e){}
  },5000);

  fetchConfig();
  pollTimer=setInterval(fetchConfig,30000);
})();
</script>
</body>
</html>
