<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>Moood TV Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(520px,92vw);background:#1c1c1c;border-radius:16px;padding:28px;box-sizing:border-box;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{margin:0 0 8px;font-size:28px}.sub{color:#bbb;margin-bottom:24px}
label{display:block;margin:14px 0 6px;color:#ddd}input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #444;background:#0d0d0d;color:#fff;font-size:16px}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:9px;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}.progress{height:10px;background:#333;border-radius:6px;margin-top:18px;overflow:hidden}.bar{height:100%;width:0;background:#fff;transition:width .2s}
#msg{margin-top:14px;min-height:22px;color:#ddd}.ok{color:#86efac!important}.err{color:#fca5a5!important}
small{display:block;color:#888;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>Moood TV Upload</h1>
<div class="sub">Replace the video shown on the café TV.</div>
<div style="color:#777;font-size:12px;margin-bottom:8px">Admin page v2</div>
<form id="form">
<label>Password</label><input id="pass" type="password" autocomplete="current-password" required>
<label>New video (MP4)</label><input id="file" type="file" accept="video/mp4,.mp4" required>
<button id="btn" type="submit">Upload & Replace</button>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="msg"></div>
<small>The TV checks for new content automatically. After upload completes, allow up to about 30 seconds for the TV to switch.</small>
</form>
</div>
<script>
(function(){
  var form=document.getElementById('form');
  var btn=document.getElementById('btn');
  var bar=document.getElementById('bar');
  var msg=document.getElementById('msg');
  var CHUNK=5*1024*1024;

  function postJson(url,obj){
    return fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(obj)
    }).then(async function(r){
      var data={};
      try{data=await r.json();}catch(e){}
      if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
      return data;
    });
  }

  function toBase64(arrayBuffer){
    var bytes=new Uint8Array(arrayBuffer), binary='', step=0x8000;
    for(var i=0;i<bytes.length;i+=step){
      binary+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+step,bytes.length)));
    }
    return btoa(binary);
  }

  form.addEventListener('submit',async function(e){
    e.preventDefault();
    var username='admin';
    var password=document.getElementById('pass').value;
    var file=document.getElementById('file').files[0];
    if(!file) return;

    if(!/\.mp4$/i.test(file.name)){
      msg.className='err'; msg.textContent='Please select an MP4 file.'; return;
    }

    btn.disabled=true; bar.style.width='0%'; msg.className=''; msg.textContent='Starting upload...';

    try{
      var session=await postJson('/api/upload-start',{
        username:username,password:password,filename:file.name,size:file.size
      });

      var parts=[];
      var totalParts=Math.ceil(file.size/CHUNK);

      for(var partNo=1; partNo<=totalParts; partNo++){
        var start=(partNo-1)*CHUNK;
        var end=Math.min(start+CHUNK,file.size);
        var buffer=await file.slice(start,end).arrayBuffer();
        var pct=Math.round(((partNo-1)/totalParts)*100);
        bar.style.width=pct+'%';
        msg.textContent='Uploading... '+pct+'%';

        var part=await postJson('/api/upload-part',{
          username:username,password:password,
          pathname:session.pathname,key:session.key,uploadId:session.uploadId,
          partNumber:partNo,data:toBase64(buffer)
        });
        parts.push({etag:part.etag,partNumber:part.partNumber});
      }

      msg.textContent='Finalizing upload...';
      await postJson('/api/upload-complete',{
        username:username,password:password,
        pathname:session.pathname,key:session.key,uploadId:session.uploadId,parts:parts
      });

      bar.style.width='100%';
      msg.className='ok';
      msg.textContent='Upload complete. The TV will switch to the new video automatically.';
      document.getElementById('file').value='';
    }catch(err){
      msg.className='err';
      msg.textContent=(err&&err.message)?err.message:'Upload failed';
    }finally{
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
